<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEYRONIX AI - Interface</title>
    <link rel="icon" type="image/png" sizes="192x192" href="logo.png">
<link rel="shortcut icon" href="logo.png" type="image/x-icon">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; }
        
        body { 
            background: #05070a; 
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(0, 102, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 212, 255, 0.08) 0%, transparent 40%);
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden;
        }

        .chat-container { 
            width: 440px; 
            height: 650px; 
            background: rgba(15, 20, 28, 0.85); 
            backdrop-filter: blur(12px);
            border-radius: 20px; 
            border: 1px solid rgba(0, 102, 255, 0.25); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), 0 0 25px rgba(0, 102, 255, 0.15); 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        /* Header Düzeneği */
        .header { 
            background: rgba(9, 13, 20, 0.9); 
            padding: 16px 20px; 
            border-bottom: 1px solid rgba(0, 102, 255, 0.2); 
            display: flex; 
            align-items: center; 
            justify-content: space-between; /* Butonu sağa yaslamak için */
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .header img { 
            width: 45px; 
            height: 45px; 
            border-radius: 50%; 
            border: 2px solid #00d4ff; 
            object-fit: cover;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #00ff88;
            border-radius: 50%;
            position: absolute;
            bottom: 2px;
            right: 2px;
            border: 2px solid #090d14;
            box-shadow: 0 0 8px #00ff88;
        }

        .header-info h2 { 
            font-size: 1.1rem; 
            letter-spacing: 2px; 
            font-weight: 700;
            background: linear-gradient(90deg, #ffffff, #80b3ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-info span {
            font-size: 0.7rem;
            color: #00d4ff;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Yeni Sohbet / Temizle Butonu */
        .clear-btn {
            background: rgba(255, 75, 75, 0.15);
            border: 1px solid rgba(255, 75, 75, 0.3);
            color: #ff8080;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .clear-btn:hover {
            background: rgba(255, 75, 75, 0.3);
            color: #fff;
            border-color: #ff4b4b;
        }

        /* Sohbet Alanı */
        .chat-box { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }

        .chat-box::-webkit-scrollbar { width: 5px; }
        .chat-box::-webkit-scrollbar-track { background: transparent; }
        .chat-box::-webkit-scrollbar-thumb { background: rgba(0, 102, 255, 0.3); border-radius: 10px; }

        .message { 
            max-width: 82%; 
            padding: 12px 16px; 
            border-radius: 16px; 
            font-size: 0.92rem; 
            line-height: 1.5; 
            word-wrap: break-word;
            animation: fadeIn 0.25s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bot-msg { 
            background: linear-gradient(135deg, #121c2d, #1a2942); 
            color: #e1edff; 
            align-self: flex-start; 
            border-left: 3px solid #00d4ff; 
            border-bottom-left-radius: 4px;
        }

        .user-msg { 
            background: linear-gradient(135deg, #0052cc, #0066ff); 
            color: #fff; 
            align-self: flex-end; 
            border-bottom-right-radius: 4px;
        }

        .quick-actions {
            padding: 8px 15px;
            display: flex;
            gap: 6px;
            overflow-x: auto;
            background: rgba(9, 13, 20, 0.5);
        }

        .chip {
            background: rgba(0, 102, 255, 0.15);
            border: 1px solid rgba(0, 102, 255, 0.3);
            color: #80b3ff;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .input-area { 
            padding: 14px; 
            background: #090d14; 
            display: flex; 
            gap: 10px; 
            border-top: 1px solid rgba(0, 102, 255, 0.2); 
        }

        input { 
            flex: 1; 
            padding: 12px 16px; 
            border-radius: 12px; 
            border: 1px solid #1a2638; 
            background: #0f1724; 
            color: #fff; 
            outline: none; 
        }

        button { 
            padding: 12px 20px; 
            border: none; 
            background: linear-gradient(135deg, #0066ff, #00d4ff); 
            color: white; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: 600; 
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <div class="header-left">
            <div class="logo-wrapper">
                <img src="logo.png" alt="VEYRONIX Logo">
                <div class="status-dot"></div>
            </div>
            <div class="header-info">
                <h2>VEYRONIX AI</h2>
                <span>Çevrimiçi</span>
            </div>
        </div>
        <button class="clear-btn" onclick="clearChat()">🗑️ Yeni Sohbet</button>
    </div>
    
    <div class="chat-box" id="chatBox">
        <div class="message bot-msg">
            Sisteme hoş geldiniz. Ben <b>VEYRONIX</b> asistanı.<br><br>
            Bana soru sorabilir veya eğitmek için:<br>
            <code>öğret: soru | cevap</code> formatını kullanabilirsiniz.
        </div>
    </div>

    <div class="quick-actions">
        <div class="chip" onclick="quickSend('merhaba')">👋 Merhaba</div>
        <div class="chip" onclick="quickSend('sen kimsin')">🤖 Sen kimsin?</div>
        <div class="chip" onclick="setTrainingTemplate()">📚 Eğitim Formatı</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Mesajınızı yazın..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Gönder</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        appendMessage(text, 'user-msg');
        input.value = '';

        try {
            const res = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });
            const data = await res.json();
            appendMessage(data.response, 'bot-msg');
        } catch (err) {
            appendMessage("⚠️ Sunucu ile bağlantı kurulamadı.", 'bot-msg');
        }
    }

    // --- SOHBETİ TEMİZLEME VE YENİ SOHBET FONKSİYONU ---
    async function clearChat() {
        const box = document.getElementById('chatBox');
        
        // Arka plana temizleme isteği gönder
        await fetch('/clear', { method: 'POST' });
        
        // Ekrandaki mesajları temizle ve karşılama mesajını tekrar yaz
        box.innerHTML = `
            <div class="message bot-msg">
                Sohbet sıfırlandı. Yeni bir oturum başlatıldı.<br><br>
                Nasıl yardımcı olabilirim?
            </div>
        `;
    }

    function appendMessage(msg, className) {
        const box = document.getElementById('chatBox');
        const div = document.createElement('div');
        div.className = `message ${className}`;
        div.innerHTML = msg;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function quickSend(text) {
        document.getElementById('userInput').value = text;
        sendMessage();
    }

    function setTrainingTemplate() {
        const input = document.getElementById('userInput');
        input.value = "öğret: Soru Buraya | Cevap Buraya";
        input.focus();
    }
</script>

</body>
</html>
